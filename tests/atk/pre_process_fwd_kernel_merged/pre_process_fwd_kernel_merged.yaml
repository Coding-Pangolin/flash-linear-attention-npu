api: pytorch
api_type: executor_pre_process_fwd_kernel_merged
version: v2.1
name: pre_process_fwd_kernel_merged
aclnn_name: PreProcessFwdKernelMerged
generate: generator_pre_process_fwd_kernel_merged
dtype_numbers: 1
extra_numbers: 0
standard:
  # 本算子按**双标杆**验收（NPU DUT + CPU 契合同精度标杆 vs CPU FP64 真值），
  # 与仓内 chunk_gated_delta_rule_fwd / chunk_kda_bwd_recompute 同一形式。
  # 注意：ATK 26.7.8 / 26.9.24 的精度注册表里都没有 `mixed_tolerance_bm` 这个名字，
  # 写成它会直接 KeyError；`cv_fused_double_benchmark` 才是两个版本都注册的标准名。
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 5
      avg_re_ratio: 1.5
      root_mean_squared_ratio: 1.5
  perf: not_key
inputs:
  - name: low_precision_marker
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: fp32_marker
    type: tensor
    required: true
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0, 0]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [1]
  - name: case_spec
    type: attr
    required: true
    dtypes:
      values: [non_param]
    ranges:
      valid:
        values: ['{"profile":"frozen_by_gen"}']
      invalid:
        values: []
  # ATK 的 BaseBackend.before_call 会丢弃 dtype=non_param 的输入（case_spec 就是 non_param），
  # 因此 executor 运行时真正要用的标量必须**单独**声明为普通属性通道：
  # 与 chunk_delta_h_bwd_preprocess 同一约定（cu_seqlens 是 list，用逗号分隔的 string 下发）。
  - name: cu_seqlens
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ['0,1024']
      invalid:
        values: []
  - name: seed
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [20260818]
      invalid:
        values: []
  - name: dtype
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [bf16]
      invalid:
        values: [fp16, fp32]
  - name: B
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1]
      invalid:
        values: [0, 2, 8]
  - name: HK
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 8, 16, 32]
      invalid:
        values: [0, 3, 5, 64]
  - name: HV
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [1, 2, 4, 8, 16, 32, 64]
      invalid:
        values: [0, 3, 128]
  - name: T
    type: attr
    required: true
    dtypes:
      values: [int]
    ranges:
      valid:
        values: [64, 128, 192, 256, 512, 1023, 1024, 2048, 4096, 8192, 11264, 16384, 32768, 65536]
      invalid:
        values: [0, 32]
  - name: K
    type: attr
    required: true
    dtypes:
      values: [int]

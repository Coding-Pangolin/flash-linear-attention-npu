  - name: gate
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [g, gk]
      invalid:
        values: [none]
  - name: gate_dtype
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: [fp32, bf16]
      invalid:
